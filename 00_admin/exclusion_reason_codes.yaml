# Frozen vocabulary of exclusion reason codes.
#
# Every row in exclusions_log.csv must carry a code from this file. Adding a
# code is allowed (science reveals new failure modes); it requires a
# PROTOCOL_DEVIATIONS.md entry. Removing or redefining a code does not.
#
# The point of this file: the manuscript must be able to say "N objects were
# excluded for predefined reason X", never "we visually removed several weird
# spectra".

codes:

  # --- catalogue / identity -------------------------------------------
  BAD_REDSHIFT:
    stage: catalog
    description: Redshift missing, flagged, or inconsistent between catalogues.
  IDENTITY_AMBIGUOUS:
    stage: catalog
    description: More than one plausible counterpart within the match radius. Fails closed.
  NO_SDSS_DESI_MATCH:
    stage: catalog
    description: No positional counterpart within the match radius.
  DUPLICATE_OBJECT:
    stage: catalog
    description: Same physical object entering twice under different identifiers.
  OUT_OF_REDSHIFT_RANGE:
    stage: catalog
    description: Outside the preregistered primary redshift range.

  # --- coverage --------------------------------------------------------
  HBETA_OUT_OF_RANGE:
    stage: coverage
    description: Rest-frame Hbeta region not covered by one or both epochs.
  INSUFFICIENT_EPOCHS:
    stage: coverage
    description: Fewer than two usable epochs.
  EPOCHS_NOT_ORDERED:
    stage: coverage
    description: Epoch ordering could not be established.

  # --- spectrum quality ------------------------------------------------
  MASKED_HBETA:
    stage: qc
    description: Masked pixel fraction in the Hbeta region exceeds the frozen limit.
  LOW_CONTINUUM_SNR:
    stage: qc
    description: Continuum S/N below the frozen minimum in one or both epochs.
  ZWARNING_SET:
    stage: qc
    description: SDSS ZWARNING or DESI ZWARN nonzero.
  BAD_FIBERSTATUS:
    stage: qc
    description: DESI FIBERSTATUS indicates a compromised fibre.
  SKY_SUBTRACTION_FAILURE:
    stage: qc
    description: Residual sky structure in the Hbeta region beyond the frozen tolerance.
  DESI_DR1_KNOWN_ISSUE:
    stage: qc
    description: Observation appears in the DESI DR1 known-issues handling table.

  # --- calibration -----------------------------------------------------
  CALIBRATION_FAILURE:
    stage: calibration
    description: Spectrophotometric calibration could not be established or verified.
  EXTREME_OIII_MISMATCH:
    stage: calibration
    description: >
      Cross-epoch [O III] flux mismatch beyond the frozen warning threshold.
      A flag for inspection, never a silent rescaling.

  # --- fitting ---------------------------------------------------------
  DECOMPOSITION_FAILURE:
    stage: fitting
    description: Host/AGN/FeII decomposition did not converge.
  FIT_FAILED:
    stage: fitting
    description: Line fit did not converge or returned a non-finite parameter.
  NO_HOST_TEMPLATE:
    stage: fitting
    description: >
      No usable recovered host template, so host injection cannot use the
      object's own host. Foreign galaxy templates are prohibited.

  # --- reference adjudication ------------------------------------------
  NO_VALID_REFERENCE_STATE:
    stage: reference
    description: Neither epoch is of adequate quality to serve as the reference state.
  ADJUDICATED_NOT_A_TRANSITION:
    stage: reference
    description: Blind adjudication concluded no genuine transition is present.
  REFERENCE_SNR_TOO_LOW_TO_DEGRADE:
    stage: reference
    description: >
      Reference spectrum S/N is below the top of the S/N grid, so the object
      cannot support the full degradation ladder. Degradation is one-directional.

  # --- reservations, not rejections -------------------------------------
  # These two record objects that left a particular run without any judgement
  # having been made about them. They must be reported separately from genuine
  # exclusions in the sample-flow diagram, or the diagram will understate the
  # eligible sample.
  HELD_OUT_STRATUM:
    stage: splits
    description: >
      Reserved in the validation or replication stratum. Not a rejection; the
      object is eligible and simply not available to development work.
  SLICE_BUDGET:
    stage: slice
    description: >
      Eligible but beyond the object budget of the feasibility slice. Not a
      rejection; carries no scientific judgement.

  # --- controls ---------------------------------------------------------
  CONTROL_NOT_MATCHABLE:
    stage: controls
    description: No control object available within the matching tolerances.
  CONTROL_SHOWS_VARIABILITY:
    stage: controls
    description: Candidate stable-AGN control failed its stability requirement.
