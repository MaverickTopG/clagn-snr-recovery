[project]
name = "p3sf"
version = "0.1.0"
description = "Spectroscopic selection function of changing-look AGN: conditional classification efficiency under counterfactual observing conditions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- science core ---
    "numpy>=2.1,<3",
    "scipy>=1.14",
    # Upper-bounded deliberately: PyQSOFit 2.1.6 predates astropy 8 and is only
    # proven against the 7.x series (CLAGN-WISE-ApJ ran it on 40,672 sources at
    # astropy 7.2.2). See 00_admin/decisions_log.md (D-003).
    "astropy>=7.0,<8",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "specutils>=2.0",
    "lmfit>=1.3",
    "spectres>=2.2",
    "PyAstronomy>=0.22",
    "sfdmap2>=0.2",
    "corner>=2.2",
    # --- spectral fitting ---
    "ppxf>=9.4",
    # PyQSOFit is vendored, not pip-resolved: see 00_scripts/00_make_environment.py
    # --- survey access ---
    "astro-datalab>=2.24",
    "sparclclient>=1.3",
    "astroquery>=0.4.10",
    "pyvo>=1.6",
    "fitsio>=1.2",
    "requests>=2.32",
    # --- statistics ---
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pygam>=0.9",
    # --- infrastructure ---
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera>=0.20",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pycurl>=7.47.0",
    "httplib2>=0.32.0",
    "fsspec[http]>=2026.7.0",
    "aiohttp>=3.14.3",
    # Official DESI camera combination is part of the science contract (D-077).
    "desispec==0.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.uv]
# sparclclient 1.3.0 declares pandas>=2.1.1,<2.2.0. That pin is stale: the
# CLAGN-WISE-ApJ venv runs sparclclient 1.3.0 against pandas 3.0.5 without
# issue, and we use only its retrieval API, not any pandas-facing surface.
# Recorded in 00_admin/decisions_log.md (D-002).
override-dependencies = ["pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3sf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires network access to SDSS/DESI/NOIRLab (deselect with -m 'not network')",
    "slow: test runs a full spectral fit (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["06_fitting/pyqsofit/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["p3sf"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["06_fitting/pyqsofit/vendor"]

# Vendored modules carry `type: ignore` comments written against the upstream
# project's stub availability. Several are redundant here and would otherwise
# produce noise that hides real errors in first-party code. The ignores stay in
# place so vendored files remain diffable against upstream.
[[tool.mypy.overrides]]
module = [
    "p3sf.access.spectra",
    "p3sf.access.datalab",
    "p3sf.access.emfit",
    "p3sf.fitting.pyqsofit_driver",
    "p3sf.fitting.ppxf_driver",
    "p3sf.stats.latent_ew",
    "p3sf.stats.censored",
    "p3sf.infra.provenance",
    "p3sf.infra.freeze",
]
warn_unused_ignores = false
